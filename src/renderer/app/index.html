<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob: deiza-preview: https://deiza.org https://*.googleusercontent.com; font-src 'self' file:; frame-src deiza-preview: http://localhost:* http://127.0.0.1:*; media-src file: deiza-preview:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Deiza</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="mode-chat panel-closed">
  <header id="titlebar">
    <div class="tb-group" id="tb-nav">
      <button class="tb-btn" id="tb-back" title="Atrás" aria-label="Atrás"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="tb-btn" id="tb-forward" title="Adelante" aria-label="Adelante"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="tb-btn" id="tb-reload" title="Recargar" aria-label="Recargar"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    </div>
    <div class="tb-group hidden" id="tb-code-left">
      <button class="tb-btn" id="tb-sidebar" title="Mostrar u ocultar sesiones (Ctrl/⌘ B)" aria-label="Barra lateral"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    </div>
    <div class="seg" role="group" aria-label="Modo">
      <button id="seg-chat" aria-pressed="true" title="Chat (Ctrl/⌘ 1)">
        <svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.8 7.05L4 20l1.1-4.2A8 8 0 1 1 21 12Z"/></svg>Chat
      </button>
      <button id="seg-code" aria-pressed="false" title="Code (Ctrl/⌘ 2)">
        <svg class="i" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>Code
      </button>
    </div>
    <div id="tb-title"></div>
    <div class="tb-right">
      <button class="pill hidden" id="tb-download"></button>
      <div class="hidden" id="tb-update"></div>
      <button class="tb-btn" id="tb-settings" title="Ajustes" aria-label="Ajustes"><svg class="i" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.54 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.54V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.54 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg></button>
    </div>
  </header>

  <div id="chat-under"></div>
  <section id="welcome" aria-label="Iniciar sesión"></section>

  <main id="code">
    <aside id="sidebar">
      <div class="sb-top">
        <button class="btn ghost wide" id="new-session">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nueva sesión
        </button>
        <button class="btn quiet wide small" id="open-folder">
          <svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>Abrir carpeta…
        </button>
      </div>
      <div class="sb-list" id="sb-list"></div>
      <div class="sb-foot" id="sb-foot"></div>
    </aside>

    <section id="thread">
      <div id="thread-head" class="hidden"></div>
      <div id="scroller"><div id="transcript"></div></div>
      <div id="statusline"></div>
      <div id="composer-wrap"></div>
    </section>

    <div id="resizer"></div>
    <aside id="panel"></aside>
  </main>

  <section id="settings" class="hidden" aria-label="Ajustes"></section>

  <div id="toasts"></div>

  <script src="../vendor/marked.js"></script>
  <script src="../vendor/purify.js"></script>
  <script src="../vendor/highlight.js"></script>
  <script src="../../shared/transcript.js"></script>
  <script src="../../shared/i18n-en.js"></script>
  <script src="../../shared/i18n.js"></script>
  <script src="../rose.js"></script>
  <script src="app.js"></script>
  <script src="settings.js"></script>
</body>
</html>
