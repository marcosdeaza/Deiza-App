<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; font-src 'self' file:; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Navegador · Deiza Code</title>
  <link rel="stylesheet" href="toolbar.css">
</head>
<body>
  <header class="bar" id="bar">
    <div class="lights"></div>
    <div class="nav">
      <button id="back" data-tip="back"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
      <button id="forward" data-tip="forward"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
      <button id="reload" data-tip="reload"><svg viewBox="0 0 16 16" id="reload-icon"><path d="M13 8a5 5 0 1 1-1.5-3.55M13 3v3h-3"/></svg></button>
    </div>
    <form id="form" class="address" autocomplete="off">
      <span class="dot" id="dot"></span>
      <input id="url" spellcheck="false" autocapitalize="off">
    </form>
    <div class="agent" id="agent">
      <svg class="glyph" viewBox="0 0 16 16"><path d="M3 1.8v11.1l2.9-2.7 2 4.4 2.1-.9-1.9-4.3h4.1z"/></svg>
      <span class="agent-text" id="agent-text">Deiza Code</span>
      <button class="agent-stop" id="agent-stop" hidden><svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.6"/></svg><span id="agent-stop-text">Detener</span></button>
    </div>
    <button id="fullscreen" class="tool" data-tip="fullscreen"><svg viewBox="0 0 16 16" id="fs-icon"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
    <div class="caption"></div>
  </header>
  <nav class="tabs" id="tabs" hidden></nav>
  <main class="start" id="start" hidden>
    <div class="start-inner">
      <span class="mark" aria-hidden="true"><svg class="start-pointer" viewBox="0 0 28 28"><path d="M4 3 L4 22.4 L9.1 17.7 L12.6 25.4 L16.3 23.8 L12.9 16.3 L20 16.3 Z"/></svg><span class="start-tag">Deiza</span></span>
      <h1 id="start-title">El navegador de Deiza</h1>
      <p id="start-text">Escribe una dirección arriba o pide en Code que abra una página. Cuando Deiza la use verás su puntero en cada clic.</p>
      <ul class="keys" id="keys"></ul>
    </div>
  </main>
  <div class="error" id="error" hidden></div>
  <script src="toolbar.js"></script>
</body>
</html>
