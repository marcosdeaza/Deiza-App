<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; font-src 'self' file:; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Navegador · Deiza Code</title>
  <link rel="stylesheet" href="toolbar.css">
</head>
<body>
  <header class="bar" id="bar">
    <div class="lights"></div>
    <div class="nav">
      <button id="back" data-tip="back"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
      <button id="forward" data-tip="forward"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
      <button id="reload" data-tip="reload"><svg viewBox="0 0 16 16" id="reload-icon"><path d="M13 8a5 5 0 1 1-1.5-3.55M13 3v3h-3"/></svg></button>
    </div>
    <form id="form" class="address" autocomplete="off">
      <span class="dot" id="dot"></span>
      <input id="url" spellcheck="false" autocapitalize="off">
    </form>
    <div class="agent" id="agent">
      <svg class="glyph" viewBox="0 0 16 16"><path d="M3 1.8v11.1l2.9-2.7 2 4.4 2.1-.9-1.9-4.3h4.1z"/></svg>
      <span class="agent-text" id="agent-text">Deiza Code</span>
      <button class="agent-stop" id="agent-stop" hidden><svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.6"/></svg><span id="agent-stop-text">Detener</span></button>
    </div>
    <button id="panel-toggle" class="tool" data-tip="panel"><svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M10 2.5v11"/></svg></button>
    <button id="fullscreen" class="tool" data-tip="fullscreen"><svg viewBox="0 0 16 16" id="fs-icon"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
    <div class="caption"></div>
  </header>
  <nav class="tabs" id="tabs" hidden></nav>
  <main class="start" id="start" hidden>
    <div class="start-inner">
      <span class="mark" aria-hidden="true"><svg class="start-pointer" viewBox="0 0 28 28"><path d="M4 3 L4 22.4 L9.1 17.7 L12.6 25.4 L16.3 23.8 L12.9 16.3 L20 16.3 Z"/></svg><span class="start-tag">Deiza</span></span>
      <h1 id="start-title">El navegador de Deiza</h1>
      <p id="start-text">Escribe una dirección arriba o pide en Code que abra una página. Cuando Deiza la use verás su puntero en cada clic.</p>
      <ul class="keys" id="keys"></ul>
    </div>
  </main>
  <aside class="side" id="side" hidden>
    <header class="side-head">
      <span class="side-mark"><svg viewBox="0 0 16 16"><path d="M3 1.8v11.1l2.9-2.7 2 4.4 2.1-.9-1.9-4.3h4.1z"/></svg></span>
      <span class="side-title">Deiza</span>
      <span class="side-state" id="side-state"></span>
      <button class="side-close" id="side-close" data-tip="panelClose"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </header>
    <div class="side-context"><span id="side-context-label">Work en esta página</span><span id="side-page"></span></div>
    <ol class="feed" id="feed" role="log" aria-live="polite" aria-relevant="additions"></ol>
    <div class="side-status" id="side-status" role="status" hidden><svg class="work-signal" viewBox="0 0 24 24" aria-hidden="true"><path class="signal-track" d="M4 17V7h5v10h5V7h6v10"/><path class="signal-ink" d="M4 17V7h5v10h5V7h6v10"/></svg><span id="side-status-text"></span></div>
    <div class="side-feedback" id="side-feedback" role="status" hidden></div>
    <form class="side-input" id="side-form" autocomplete="off">
      <textarea id="side-text" rows="2" spellcheck="true" aria-label="Escribe a Deiza"></textarea>
      <div class="side-compose-actions">
        <button id="side-mic" class="mic" type="button" data-tip="dictate"><svg viewBox="0 0 16 16"><rect x="5.5" y="2" width="5" height="8" rx="2.5"/><path d="M3.5 7.5v.8a4.5 4.5 0 0 0 9 0v-.8M8 13v2M5.5 15h5"/></svg></button>
        <span class="compose-hint" id="compose-hint"></span>
        <button id="side-send" type="submit" data-tip="send"><svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button>
      </div>
      <div class="voice-strip" id="voice-strip" hidden><span class="voice-dot"></span><span id="voice-clock">0:00</span><span id="voice-label">Escuchando…</span><button id="voice-cancel" type="button" data-tip="discard"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button><button id="voice-done" type="button" data-tip="transcribe"><svg viewBox="0 0 16 16"><path d="m3 8 3.5 3.5L13 5"/></svg></button></div>
    </form>
    <div class="side-options" id="side-options" hidden>
      <span class="options-label" id="options-label">Modelo y esfuerzo</span>
      <div class="options-row"><select id="side-model" aria-label="Modelo"><option value="liquid">Liquid 5.5</option><option value="solid">Solid 5</option><option value="liquid51">Liquid 5.1</option></select><select id="side-effort" aria-label="Esfuerzo"><option value="low">Bajo</option><option value="medium">Auto</option><option value="high">Alto</option><option value="max">Máximo</option></select></div>
    </div>
  </aside>
  <div class="error" id="error" hidden></div>
  <script src="toolbar.js"></script>
</body>
</html>
